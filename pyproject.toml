[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wintune"
version = "1.2.4-android"
description = "WinTune MP3 Downloader Android App"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "WinTune Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests",
    "yt-dlp",
    "numpy",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.buildozer]
title = "WinTune MP3 Downloader"
package.name = "wintune"
package.domain = "org.wintune"
source.dir = "."
version = "1.2.4"
requirements = "python3, python3-requests, python3-yt-dlp, python3-numpy"
orientation = "portrait"
icon.filename = "assets/icon.png"
permission = [
    "INTERNET",
    "WRITE_EXTERNAL_STORAGE",
    "READ_EXTERNAL_STORAGE",
    "FOREGROUND_SERVICE",
]
android.api = 34
android.minapi = 21
android.sdk = 34
android.arch = "arm64-v8a"
p4a.branch = "master"